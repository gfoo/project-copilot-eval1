name: Frontend CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # Check if frontend files changed
    changes:
        runs-on: ubuntu-latest
        outputs:
            frontend: ${{ steps.filter.outputs.frontend }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      frontend:
                        - 'frontend/**'
                        - '.github/workflows/frontend-ci.yml'

    build-and-lint:
        needs: changes
        runs-on: ubuntu-latest
        if: needs.changes.outputs.frontend == 'true'
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Lint
              working-directory: frontend
              run: npm run lint

            - name: Build
              working-directory: frontend
              run: npm run build

    # This job always runs and reports success - needed for required status checks
    build-and-lint-status:
        needs: [changes, build-and-lint]
        runs-on: ubuntu-latest
        if: always()
        steps:
            - name: Check status
              run: |
                  if [[ "${{ needs.changes.outputs.frontend }}" == "false" ]]; then
                    echo "✅ Skipped - no frontend changes"
                    exit 0
                  elif [[ "${{ needs.build-and-lint.result }}" == "success" ]]; then
                    echo "✅ Frontend build and lint passed"
                    exit 0
                  else
                    echo "❌ Frontend build or lint failed"
                    exit 1
                  fi
